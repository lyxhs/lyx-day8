# STM3241G-EVAL: This is an STM32F4 eval board with a single STM32F417IGH6
# (1024KB) chip.
# http://www.st.com/internet/evalboard/product/252216.jsp
#
# This is for using the onboard STLINK/V2

source [find interface/stlink.cfg]

transport select swd

# increase working area to 128KB
set WORKAREASIZE 0x20000

# chip name
set CHIPNAME STM32F417IGH6

source [find target/stm32f4x.cfg]

# C 型开发板的 4 针 SWD 口没有引出 NRST，硬件复位（srst_only）会超时：
#   Error: timed out while waiting for target halted / Unable to reset target
# 改为不依赖 NRST 的 SYSRESETREQ 软复位
reset_config none separate